<main class="container">
  <h1>Novo livro — Angular</h1>

  <form (ngSubmit)="incluir()">
    <label>
      Título
      <input [(ngModel)]="titulo" name="titulo" required>
    </label>

    <label>
      Código da editora
      <select [(ngModel)]="codEditora" name="codEditora">
        <option [ngValue]="1">1 - Companhia das Letras</option>
        <option [ngValue]="2">2 - Pearson</option>
        <option [ngValue]="3">3 - Alta Books</option>
      </select>
    </label>

    <label>
      Resumo
      <textarea [(ngModel)]="resumo" name="resumo"></textarea>
    </label>

    <label>
      Autores
      <input [(ngModel)]="autores" name="autores">
    </label>

    <button type="submit">Salvar</button>
  </form>
</main>
